[package]
name = "syncpoint"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "syncpoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
# Rebuild only what changed, which is most of a `tauri dev` cycle.
incremental = true

[profile.release]
# Slower to build, better to ship: one codegen unit and link-time optimisation
# let LLVM see across the whole program.
codegen-units = 1
lto = true
# Size over speed. The work this app does is rsync's, not its own, so a smaller
# download is worth more than instructions saved in the shell around it.
opt-level = "s"
# No unwinding: a panic ends the process instead of being caught. Nothing here
# catches one anyway — a panic while holding a lock poisons it, and every
# `.lock().unwrap()` after that panics too — so the app was already finished at
# that point, just more slowly and less obviously.
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
notify = "8"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2.5.8"

