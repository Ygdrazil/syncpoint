# Release pipeline: tagging a commit on main builds and publishes the app.
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# macOS only: a Tauri app is a Rust binary linked against WebKit and AppKit,
# so it must be compiled on macOS against the macOS SDK. GitHub's macOS
# runners (macos-latest) are Apple Silicon and have everything preinstalled.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: TAURI_SIGNING_PRIVATE_KEY
#   Value: the base64 private key (no password was set during generation)

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Bump tauri.conf.json version
        # The app reads its own version from git via build.rs, but the bundle's
        # Info.plist takes it from tauri.conf.json — leave that alone and Finder
        # would report a stale version on every release after the first.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const f='src-tauri/tauri.conf.json';
          const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=process.argv[1];
          fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n')" "$VERSION"

      - name: Build universal macOS app
        # Universal so the build runs on both Apple Silicon and Intel machines.
        # createUpdaterArtifacts in tauri.conf.json makes this also produce
        # the .app.tar.gz + .sig the auto-updater needs, alongside the DMG.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Copy artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p release
          cp "$BUNDLE/dmg/SyncPoint_${VERSION}_universal.dmg" \
            "release/SyncPoint-${GITHUB_REF_NAME}-universal.dmg"
          # Updater artifacts: the .app.tar.gz is what the auto-updater downloads
          # and installs (not the DMG); the .sig is verified against the pubkey
          # in tauri.conf.json before the update is applied.
          cp "$BUNDLE/macos/SyncPoint.app.tar.gz" \
            "release/SyncPoint-${GITHUB_REF_NAME}-universal.app.tar.gz"
          cp "$BUNDLE/macos/SyncPoint.app.tar.gz.sig" \
            "release/SyncPoint-${GITHUB_REF_NAME}-universal.app.tar.gz.sig"

      - name: Generate latest.json manifest
        # The auto-updater fetches this manifest to learn the current version,
        # download URL, and signature. GitHub Releases serves it as a release
        # asset named latest.json — the app's endpoint config points at
        # releases/latest/download/latest.json, which GitHub redirects to the
        # newest release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIG=$(cat "release/SyncPoint-${GITHUB_REF_NAME}-universal.app.tar.gz.sig")
          URL="https://github.com/Ygdrazil/syncpoint/releases/download/${GITHUB_REF_NAME}/SyncPoint-${GITHUB_REF_NAME}-universal.app.tar.gz"
          node -e "
          const fs=require('fs');
          const sig=process.argv[1];
          const url=process.argv[2];
          const version=process.argv[3];
          const manifest={
            version,
            notes:'SyncPoint '+version,
            pub_date:new Date().toISOString(),
            platforms:{
              'darwin-aarch64':{signature:sig,url},
              'darwin-x86_64':{signature:sig,url}
            }
          };
          fs.writeFileSync('release/latest.json',JSON.stringify(manifest,null,2));
          " "$SIG" "$URL" "$VERSION"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Universal macOS build (Apple Silicon and Intel).

            This build is **ad-hoc signed**, not notarized. To open it the
            first time, right-click the app and choose Open, or clear the
            quarantine flag:

            ```
            xattr -cr /Applications/SyncPoint.app
            ```
          files: |
            release/SyncPoint-${{ github.ref_name }}-universal.dmg
            release/SyncPoint-${{ github.ref_name }}-universal.app.tar.gz
            release/latest.json
