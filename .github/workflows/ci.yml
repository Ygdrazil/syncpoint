name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux is enough to test: only the menu layout is behind
    # cfg(target_os = "macos"), and no test touches it. Ubuntu minutes are also
    # billed at 1x where macOS is 10x on private repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev pkg-config

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust ships preinstalled on GitHub runners, so no toolchain action is
      # needed. rust-cache is kept: replacing it with actions/cache means
      # hand-rolling keys for the registry, git db and target dir, which is
      # easy to get subtly wrong.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Svelte and TypeScript check
        run: pnpm check
