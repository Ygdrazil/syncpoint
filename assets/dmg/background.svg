<!--
  Source for the DMG install window background.

  Authored 1320x1320 with the real 660x400 design centred, because qlmanage
  renders an SVG into a square canvas — the square is cropped back off below.
  Drawn at 2x so the text stays sharp when it is downsampled to 1x.

  Regenerate:
    qlmanage -t -s 1320 -o . background.svg
    sips -c 800 1320 background.svg.png --out bg-2x.png
    sips -z 400 660  bg-2x.png          --out bg-1x.png
    tiffutil -cathidpicheck bg-1x.png bg-2x.png -out background.tiff

  The result is one file holding both resolutions. Finder draws a DMG
  background at its natural size in points, so a plain 660x400 PNG is scaled
  up on a Retina display and looks soft; the 2x representation is what stops
  that. Positions here must stay in step with `bundle.macOS.dmg` in
  tauri.conf.json — the icons are placed by Finder, not by this image.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#e6ebf4"/>
    </linearGradient>
  </defs>
  <rect width="1320" height="1320" fill="#eef1f6"/>
  <!-- The design is 660x400; drawn at 2x and centred so sips can crop it out. -->
  <g transform="translate(0,260) scale(2)">
    <rect width="660" height="400" fill="url(#bg)"/>

    <text x="330" y="66" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial"
          font-size="30" font-weight="600" fill="#2b3040">SyncPoint</text>
    <text x="330" y="94" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial"
          font-size="13" fill="#7b8494">Drag it onto Applications to install</text>

    <!-- Between the two icon slots: app centred at 180, Applications at 480,
         each 128 wide, so the gap runs 244 to 416. -->
    <g stroke="#4aa3e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M272 170h108"/>
      <path d="M368 157l13 13-13 13"/>
    </g>

    <text x="330" y="356" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial"
          font-size="11" fill="#9aa2b1">Keeps a folder mirrored on a remote host over SSH</text>
  </g>
</svg>
